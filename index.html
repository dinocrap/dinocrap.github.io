<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dinocrap — memento mori</title>
<style>
  :root { --accent:#E89EB8; --bg:#0d0d0d; --fg:#e8e8e8; --dim:#7a7a7a; }
  * { box-sizing:border-box }
  body {
    margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
    font:15px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
    display:flex; flex-direction:column; align-items:center; padding:48px 20px;
  }
  h1 { font-size:15px; font-weight:600; letter-spacing:.22em; text-transform:uppercase; margin:0 0 6px }
  p.sub { color:var(--dim); margin:0 0 32px; font-size:13px }
  img { max-height:72vh; border:1px solid #262626; border-radius:12px; display:block }
  .row { display:flex; gap:10px; margin-top:22px; flex-wrap:wrap; justify-content:center }
  a.btn {
    color:var(--accent); text-decoration:none; border:1px solid #2e2e2e;
    padding:7px 15px; border-radius:999px; font-size:13px;
  }
  a.btn:hover { border-color:var(--accent) }
  footer { color:var(--dim); font-size:12px; margin-top:34px; text-align:center }
  code { color:var(--accent) }
</style>

<h1>Memento&nbsp;Mori</h1>
<p class="sub">Regenerated every morning. Remember you must die.</p>

<img id="wp" src="wallpaper.png" alt="Current wallpaper">

<div class="row">
  <a class="btn" href="wallpaper.png">wallpaper.png</a>
  <a class="btn" href="life.png">life view</a>
  <a class="btn" href="https://github.com/dinocrap/dinocrap.github.io">source</a>
</div>

<footer>
  Point your phone at <code>https://dinocrap.github.io/wallpaper.png</code><br>
  <span id="stamp"></span>
</footer>

<script>
  // cache-bust the preview so this page never shows yesterday's image
  document.getElementById('wp').src = 'wallpaper.png?v=' + Date.now();
  fetch('last-updated.txt?v=' + Date.now())
    .then(r => r.ok ? r.text() : '')
    .then(t => { if (t.trim()) document.getElementById('stamp').textContent = 'last generated ' + t.trim(); })
    .catch(() => {});
</script>
</html>
